name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zip'i aç
        run: unzip -o Seray_Saglik_Asistanim_ILAVELI.zip -d .

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
          channel: stable

      - run: flutter doctor -v

      - run: flutter pub get

      - run: flutter build apk --release

      - name: APK'yi numarala
        run: cp build/app/outputs/flutter-apk/app-release.apk seray-saglik-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: seray-saglik-v${{ github.run_number }}
          path: seray-saglik-v${{ github.run_number }}.apk
          
