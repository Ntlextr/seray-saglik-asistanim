name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i bul, ac ve yapiyi duzelt
        run: |
          ZIP_DOSYASI=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_DOSYASI" ]; then
            echo "Bulunan zip: $ZIP_DOSYASI"
            mkdir -p gecici_klasor
            unzip -o "$ZIP_DOSYASI" -d gecici_klasor
            if [ -f gecici_klasor/pubspec.yaml ]; then
              KAYNAK="gecici_klasor"
            else
              KAYNAK=$(dirname "$(find gecici_klasor -maxdepth 3 -name pubspec.yaml | head -n 1)")
            fi
            echo "Bulunan proje klasoru: $KAYNAK"
            cp -r "$KAYNAK"/. .
          else
            echo "UYARI: Repo icinde .zip dosyasi bulunamadi."
          fi
      - name: Kontrol
        run: |
          echo "pubspec.yaml var mi:"
          ls pubspec.yaml
          echo "main.dart var mi:"
          ls lib/main.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      # YENİ: Bozuk kaydedilen tüm kod dosyalarını otomatik standart UTF-8'e çeviren kurtarıcı adım
      - name: Kod Dosyalarindaki UTF-8 Karakter Bozukluklarini Otomatik Tamir Et
        run: |
          find lib/ -name "*.dart" -type f -exec sh -c 'iconv -f WINDOWS-1254 -t UTF-8 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \; || true
          find lib/ -name "*.dart" -type f -exec sh -c 'iconv -f ISO-8859-9 -t UTF-8 "$1" > "$1.tmp" && mv "$1.tmp" "$1"' _ {} \; || true

      - run: flutter pub get
      
      - name: Android Altyapisini Sifirdan Olustur
        run: flutter create . --platforms android

      - run: flutter build apk --release
      - name: APK'yi numarala
        run: cp build/app/outputs/flutter-apk/app-release.apk seray-teknoloji-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seray-teknoloji-v${{ github.run_number }}
          path: seray-teknoloji-v${{ github.run_number }}.apk
