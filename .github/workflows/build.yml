name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: unzip -o "Seray_AI_Saglik_Asistanim (flutlab.io).zip" -d .
      - name: Kotlin surumunu guncelle
        run: sed -i 's/org.jetbrains.kotlin.android") version "1.8.22"/org.jetbrains.kotlin.android") version "2.1.0"/' android/settings.gradle.kts
      - name: Gemini paketini ve anahtarini guncelle
        run: |
          python3 - <<'EOF'
          with open('pubspec.yaml') as f:
              content = f.read()
          content = content.replace('google_generative_ai: ^0.4.0', 'googleai_dart: ^2.1.0')
          with open('pubspec.yaml', 'w') as f:
              f.write(content)

          with open('lib/main.dart') as f:
              content = f.read()
          content = content.replace(
              "import 'package:google_generative_ai/google_generative_ai.dart';",
              "import 'package:googleai_dart/googleai_dart.dart';"
          )
          content = content.replace(
              "AQ.Ab8RN6KkWuaBfsFPcqC6udSR_oeJHr5_x8b6_A76gV8GbyB1hg",
              "AQ.Ab8RN6LQTThMgNTmxqX8O5VfkGFxrSRGPG5UjUgYN0TdR2Y8Lg"
          )
          old_block = (
              "final model = GenerativeModel(model: 'gemini-3.5-flash', apiKey: _apiKey);\n"
              "      final response = await model.generateContent([Content.text(metin)]);\n"
              "      final cevap = response.text ?? \"Anlayamadım abim.\";"
          )
          new_block = (
              "final client = GoogleAIClient(config: GoogleAIConfig.googleAI(authProvider: ApiKeyProvider(_apiKey)));\n"
              "      final response = await client.models.generateContent(model: 'gemini-2.5-flash', request: GenerateContentRequest(contents: [Content(parts: [TextPart(metin)], role: 'user')]));\n"
              "      String cevap = \"Anlayamadım abim.\";\n"
              "      final parcalar = response.candidates?.first.content?.parts ?? [];\n"
              "      for (final p in parcalar) {\n"
              "        if (p is TextPart) {\n"
              "          cevap = p.text;\n"
              "          break;\n"
              "        }\n"
              "      }\n"
              "      client.close();"
          )
          content = content.replace(old_block, new_block)
          with open('lib/main.dart', 'w') as f:
              f.write(content)
          EOF
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: seray-saglik-apk
          path: build/app/outputs/flutter-apk/app-release.apk