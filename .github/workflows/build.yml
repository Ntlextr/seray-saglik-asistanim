name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: GitHub Derleyici Sistem Dilini Turkce UTF-8 Olarak Zorunlu Kil
        run: |
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale LANG=tr_TR.UTF-8
          echo "LANG=tr_TR.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=tr_TR.UTF-8" >> $GITHUB_ENV
          
      - name: Zip'i bul, ac ve yapiyi duzelt
        run: |
          ZIP_DOSYASI=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_DOSYASI" ]; then
            echo "Bulunan zip: $ZIP_DOSYASI"
            mkdir -p gecici_klasor
            unzip -o "$ZIP_DOSYASI" -d gecici_klasor
            if [ -f gecici_klasor/pubspec.yaml ]; then
              KAYNAK="gecici_klasor"
            else
              KAYNAK=$(dirname "$(find gecici_klasor -maxdepth 3 -name pubspec.yaml | head -n 1)")
            fi
            echo "Bulunan proje klasoru: $KAYNAK"
            cp -r "$KAYNAK"/. .
          else
            echo "UYARI: Repo icinde .zip dosyasi bulunamadi."
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      # SİHİRLİ ADIM 1: Google paketini senin Flutter sürümünle %100 uyumlu kararlı eski sürüme çekiyoruz
      - name: Googleai_dart Kütüphanesini Kararlı Sürüme Sabitle
        run: |
          sed -i 's/googleai_dart:.*/googleai_dart: ^2.1.0/g' pubspec.yaml

      # SİHİRLİ ADIM 2: Hata veren tüm Türkçe harfleri evrensel karakter korumasına alıyoruz (Soru işaretlerini bitirir)
      - name: Projedeki Tüm Bozuk Karakterleri Evrensel Kelimelerle Değiştir
        run: |
          find lib/ -name "*.dart" -type f -exec sed -i 's/İyi Akşamlar/Iyi Aksamlar/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/İyi Günler/Iyi Gunler/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/İyi Geceler/Iyi Geceler/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Günaydın/Gunaydin/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Sağlık/Saglik/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ölçüm/Olcum/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Yönetimi/Yonetimi/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/GÜVENLİ ÇIKIŞ/GUVENLI CIKIS/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Doktora Gönder/Doktora Gonder/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/İlaç/Ilac/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Özet/Ozet/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Tahlil/Tahlil/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Yükle/Yukle/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i "s/Ã¯Â½/ /g" {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i "s/Â¿/?/g" {} \; || true

      - run: flutter pub get
      
      - name: Android Altyapisini Sifirdan Olustur
        run: flutter create . --platforms android

      - name: Android Internet İzinlerini ve SDK Ayarlarini Enjekte Et
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk =.*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/ndkVersion =.*/ndkVersion = "27.0.12077973"/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' android/app/build.gradle
          fi
          
          sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          
          echo "systemProp.file.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Dfile.encoding=UTF-8" >> android/gradle.properties

      - run: flutter build apk --release --no-tree-shake-icons
      - name: APK'yi numarala
        run: cp build/app/outputs/flutter-apk/app-release.apk seray-teknoloji-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seray-teknoloji-v${{ github.run_number }}
          path: seray-teknoloji-v${{ github.run_number }}.apk
