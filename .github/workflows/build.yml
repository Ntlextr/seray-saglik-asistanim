    - name: Android build.gradle Güncelle
      run: |
        python3 - << 'PYEOF'
        import os

        # Gradle dosya yolunu kontrol edin
        gradle_yol = "android/app/build.gradle" 

        yeni_gradle = """
    defaultConfig {
        applicationId "{applicationId}"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
"""
        with open(gradle_yol, "w", encoding="utf-8") as f:
            f.write(yeni_gradle)
        print(f"{gradle_yol} komple, garantili icerikle yeniden yazildi (compileSdk 36).")
        PYEOF

    - name: KONTROL Manifest Icerigini Goster
      run: |
        echo "----- AndroidManifest.xml (izinler) -----"
        grep "uses-permission" android/app/src/main/AndroidManifest.xml || echo "HIC IZIN BULUNAMADI!"
        echo "------------------------------------------"

    - name: Bagimliliklari Yukle
      run: flutter pub get

    - name: Uygulama Ikonlarini Olustur
      run: flutter pub run flutter_launcher_icons

    - name: Acilis Ekranini (Splash) Olustur
      run: flutter pub run flutter_native_splash:create

    - name: APK Derle (Release Surumu)
      run: flutter build apk --release

    - name: Hem APK Hem Tum Kaynak Kodlari Tek Bir ZIP Paketi Yap
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ' | tr -d '\r')
        SUPER_ZIP_NAME="seray_saglik_HEPS_ICINDE_v${VERSION}.zip"
        cp build/app/outputs/flutter-apk/app-release.apk "./seray_saglik_asistanim_v${VERSION}.apk"
        zip -r "${SUPER_ZIP_NAME}" "./seray_saglik_asistanim_v${VERSION}.apk" lib assets pubspec.yaml .github android
        echo "SUPER_ZIP=${SUPER_ZIP_NAME}" >> $GITHUB_ENV

    - name: 🎁 TEK PAKETTE (APK + KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SUPER_ZIP }}
        path: ${{ env.SUPER_ZIP }}
