name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: GitHub Derleyici Sistem Dilini Turkce UTF-8 Olarak Zorunlu Kil
        run: |
          sudo locale-gen tr_TR.UTF-8
          sudo update-locale LANG=tr_TR.UTF-8
          echo "LANG=tr_TR.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=tr_TR.UTF-8" >> $GITHUB_ENV
          
      - name: Zip'i bul, ac ve yapiyi duzelt
        run: |
          ZIP_DOSYASI=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_DOSYASI" ]; then
            echo "Bulunan zip: $ZIP_DOSYASI"
            mkdir -p gecici_klasor
            unzip -o "$ZIP_DOSYASI" -d gecici_klasor
            if [ -f gecici_klasor/pubspec.yaml ]; then
              KAYNAK="gecici_klasor"
            else
              KAYNAK=$(dirname "$(find gecici_klasor -maxdepth 3 -name pubspec.yaml | head -n 1)")
            fi
            echo "Bulunan proje klasoru: $KAYNAK"
            cp -r "$KAYNAK"/. .
          else
            echo "UYARI: Repo icinde .zip dosyasi bulunamadi."
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Googleai_dart Kütüphanesini Arka Planda Güncelle
        run: |
          sed -i 's/googleai_dart:.*/googleai_dart: ^3.1.0/g' pubspec.yaml

      # SİHİRLİ ADIM 1: Projedeki İSTİSNASIZ TÜM sayfaları (main.dart dahil) tarayıp bozuk harfleri gıcır gıcır Türkçe yapar
      - name: Tüm Sayfalardaki Karakter Bozukluklarini Küresel Olarak Onar
        run: |
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x84Â±/ı/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x84Â\x9f/ğ/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x85Â\x9f/ş/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x84Â°/İ/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x84Â\x9e/Ğ/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x85Â\x9e/Ş/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â¼/ü/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â¶/ö/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â§/ç/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â\x96/Ö/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â\x9c/Ü/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x83Â\x87/Ç/g' {} \; || true
          find lib/ -name "*.dart" -type f -exec sed -i 's/Ã\x82Â//g' {} \; || true

      - run: flutter pub get
      
      - name: Android Altyapisini Sifirdan Olustur
        run: flutter create . --platforms android

      # SİHİRLİ ADIM 2: Google API'ye erişimi engelleyen Android güvenlik kilidini (cleartextTraffic) devre dışı bırakır
      - name: Android Internet Ağ Güvenlik Ağını Tamamen Serbest Bırak
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>' android/app/src/main/AndroidManifest.xml
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml
          fi
          
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk =.*/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/compileSdk =.*/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/ndkVersion =.*/ndkVersion = "27.0.12077973"/g' android/app/build.gradle.kts
          fi
          
          echo "systemProp.file.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Dfile.encoding=UTF-8" >> android/gradle.properties

      - run: flutter build apk --release --no-tree-shake-icons
      - name: APK'yi numarala
        run: cp build/app/outputs/flutter-apk/app-release.apk seray-teknoloji-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seray-teknoloji-v${{ github.run_number }}
          path: seray-teknoloji-v${{ github.run_number }}.apk
