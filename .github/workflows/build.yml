name: Flutter Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Proje ZIP Dosyasını Klasöre Çıkar (Unzip)
      run: |
        if [ -f "seray_saglikv1.46.zip" ]; then
          mkdir -p ham_ayiklama
          unzip -q seray_saglikv1.46.zip -d ham_ayiklama
          echo "ZIP başarıyla açıldı, dizin yapısı düzeltiliyor..."
          
          if [ -f "ham_ayiklama/pubspec.yaml" ]; then
            mv ham_ayiklama proje_klasoru
          else
            mv ham_ayiklama/* proje_klasoru/ 2>/dev/null || mv ham_ayiklama proje_klasoru
          fi
          
          echo "Güncel proje dizini:"
          ls -la proje_klasoru
        else
          echo "HATA: seray_saglikv1.46.zip dosyası ana dizinde bulunamadı!"
          exit 1
        fi

    - name: Android build.gradle Güncelle
      run: |
        mkdir -p proje_klasoru/android/app
        echo "" | base64 -d > proje_klasoru/android/app/build.gradle
        echo "android/app/build.gradle dosyası oluşturuldu."

    - name: Android v2 Embedding Dönüşümü Yap
      run: |
        echo "MainActivity dosyaları aranıyor ve v2 embedding yapısına dönüştürülüyor..."
        find proje_klasoru/android/app/src/main -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r dosya; do
          if [[ "$dosya" == *.kt ]]; then
            echo "Kotlin dosyası güncelleniyor: $dosya"
            package_name=$(grep "package" "$dosya" | head -n 1)
            echo -e "$package_name\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}" > "$dosya"
          elif [[ "$dosya" == *.java ]]; then
            echo "Java dosyası güncelleniyor: $dosya"
            package_name=$(grep "package" "$dosya" | head -n 1)
            echo -e "$package_name\n\nimport io.flutter.embedding.android.FlutterActivity;\n\npublic class MainActivity extends FlutterActivity {\n}" > "$dosya"
          fi
        done

    - name: AndroidManifest.xml v1 Kalıntılarını Temizle
      run: |
        echo "AndroidManifest.xml temizliği başlatılıyor..."
        find proje_klasoru/android -name "AndroidManifest.xml" | while read -r manifest; do
          echo "Düzenlenen dosya: $manifest"
          # Eski v1 embedding meta-data satırlarını tamamen kaldırır
          sed -i '/android:name="io.flutter.app.FlutterApplication"/d' "$manifest"
          sed -i '/android:name="io.flutter.embedding.android.SplashScreenDrawable"/d' "$manifest"
          # Dokümantasyona göre eski name tanımlarını temizleyip normalleştirir
          sed -i 's/android:name="io.flutter.app.FlutterActivity"/android:name="io.flutter.embedding.android.FlutterActivity"/g' "$manifest"
        done

    - name: KONTROL Manifest Icerigini Goster
      run: |
        echo "----- AndroidManifest.xml (izinler) -----"
        grep "uses-permission" proje_klasoru/android/app/src/main/AndroidManifest.xml || echo "AndroidManifest veya izin bulunamadı."
        echo "------------------------------------------"

    - name: Bagimliliklari Yukle
      working-directory: proje_klasoru
      run: flutter pub get

    - name: Uygulama Ikonlarini Olustur
      working-directory: proje_klasoru
      run: |
        flutter pub run flutter_launcher_icons || echo "Ikon paketi bulunamadı, bu adım atlanıyor."

    - name: Acilis Ekranini (Splash) Olustur
      working-directory: proje_klasoru
      run: |
        flutter pub run flutter_native_splash:create || echo "Splash paketi bulunamadı, bu adım atlanıyor."

    - name: APK Derle (Release Surumu)
      working-directory: proje_klasoru
      run: flutter build apk --release

    - name: Hem APK Hem Tum Kaynak Kodlari Tek Bir ZIP Paketi Yap
      working-directory: proje_klasoru
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ' | tr -d '\r')
        SUPER_ZIP_NAME="seray_saglik_HEPS_ICINDE_v${VERSION}.zip"
        cp build/app/outputs/flutter-apk/app-release.apk "../seray_saglik_asistanim_v${VERSION}.apk"
        cd ..
        zip -r "${SUPER_ZIP_NAME}" "./seray_saglik_asistanim_v${VERSION}.apk" proje_klasoru/lib proje_klasoru/assets proje_klasoru/pubspec.yaml .github
        echo "SUPER_ZIP=${SUPER_ZIP_NAME}" >> $GITHUB_ENV

    - name: 🎁 TEK PAKETTE (APK + KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_derleme_sonucu
        path: ${{ env.SUPER_ZIP }}
        
