name: Flutter Build APK from ZIP (Safe Solution)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Derleme Scriptini Calistir
      run: |
        chmod +x derle.sh
        ./derle.sh

    - name: 🎁 TEK PAKETTE (APK + KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_derleme_sonucu
        path: "*.zip"
        
