name: Flutter Build APK from Any ZIP (Seray Saglik Light Production)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Proje ZIP Dosyasını Otomatik Tespit Et ve Çıkar
      run: |
        ZIP_DOSYASI=$(ls *.zip | head -n 1)
        if [ -n "$ZIP_DOSYASI" ]; then
          echo "Bulunan Proje Paketi: $ZIP_DOSYASI"
          mkdir -p ham_ayiklama
          unzip -q "$ZIP_DOSYASI" -d ham_ayiklama
          
          if [ -f "ham_ayiklama/pubspec.yaml" ]; then
            mv ham_ayiklama projem
          else
            mkdir -p projem
            mv ham_ayiklama/* projem/ 2>/dev/null || mv ham_ayiklama projem
          fi
          echo "Kaynak dosyalar başarıyla ayıklandı."
        else
          echo "HATA: Ana dizinde hiçbir .zip dosyası bulunamadı!"
          exit 1
        fi

    - name: Otomatik Sürüm (Version) Artırıcı Yapılandırılıyor
      run: |
        cd projem
        OLD_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
        BASE_VER=$(echo $OLD_VERSION | cut -d'+' -f1)
        BUILD_NUM=$(echo $OLD_VERSION | cut -d'+' -f2)
        NEW_PATCH=$(echo $BASE_VER | cut -d'.' -f3)
        NEW_PATCH=$((NEW_PATCH + 1))
        NEW_VERSION="$(echo $BASE_VER | cut -d'.' -f1).$(echo $BASE_VER | cut -d'.' -f2).${NEW_PATCH}+$((BUILD_NUM + 1))"
        sed -i "s/version: .*/version: ${NEW_VERSION}/g" pubspec.yaml
        echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
        echo "SUPER_VERSION=${NEW_VERSION%+*}" >> $GITHUB_ENV
        echo "Eski Versiyon: $OLD_VERSION -> Yeni Versiyon: $NEW_VERSION"

    - name: Uygulama İsmi ve Modern Gradle Standartları Enjekte Ediliyor
      run: |
        sed -i 's/android:label=".*/android:label="Seray Sağlık Asistanım"/g' projem/android/app/src/main/AndroidManifest.xml
        
        cat << 'EOF' > projem/android/app/build.gradle
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }
        android {
            namespace "com.serayteknoloji.saglik_asistanim"
            compileSdk 36
            compileOptions {
                coreLibraryDesugaringEnabled true
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            defaultConfig {
                applicationId "com.serayteknoloji.saglik_asistanim"
                minSdkVersion 23
                targetSdkVersion 36
                multiDexEnabled true
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                }
            }
        }
        dependencies {
            coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
        }
        EOF
        echo "build.gradle başarıyla güncellendi."

    - name: İlaç Hatırlatıcı Tam Zamanlı Alarm İzinleri Ekleniyor
      run: |
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' projem/android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' projem/android/app/src/main/AndroidManifest.xml

    - name: Bağımlılıklar Yükleniyor ve APK Derleniyor
      run: |
        cd projem
        flutter pub get
        flutter clean
        flutter build apk --release

    - name: Sadece Gerekli Klasörleri ve APK'yı Hafif ZIP Paketi Yap
      run: |
        # 521 MB'lık çöp build klasörlerini dahil etmemek için sadece kritik yerleri zipliyoruz
        cp projem/build/app/outputs/flutter-apk/app-release.apk "./Seray_Siglik_Asistanim_v${{ env.SUPER_VERSION }}.apk"
        mkdir -p teslimat_paketi
        cp "./Seray_Siglik_Asistanim_v${{ env.SUPER_VERSION }}.apk" ./teslimat_paketi/
        cp -r projem/lib ./teslimat_paketi/
        cp -r projem/assets ./teslimat_paketi/
        cp projem/pubspec.yaml ./teslimat_paketi/
        cp -r .github ./teslimat_paketi/
        
        cd teslimat_paketi
        zip -r "../seray_saglik_asistanim_v${{ env.SUPER_VERSION }}.zip" .
        cd ..

    - name: 🎁 TEK PAKETTE (APK + TÜM KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_asistanim_hafif_paket
        path: "seray_saglik_asistanim_v*.zip"
