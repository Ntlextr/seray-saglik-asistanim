name: Flutter Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Android build.gradle Güncelle
      run: |
        cat << 'EOF' > android/app/build.gradle
    defaultConfig {
        applicationId "{applicationId}"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
EOF
        echo "android/app/build.gradle komple, garantili icerikle yeniden yazildi (compileSdk 36)."

    - name: KONTROL Manifest Icerigini Goster
      run: |
        echo "----- AndroidManifest.xml (izinler) -----"
        grep "uses-permission" android/app/src/main/AndroidManifest.xml || echo "HIC IZIN BULUNAMADI!"
        echo "------------------------------------------"

    - name: Bagimliliklari Yukle
      run: flutter pub get

    - name: Uygulama Ikonlarini Olustur
      run: flutter pub run flutter_launcher_icons

    - name: Acilis Ekranini (Splash) Olustur
      run: flutter pub run flutter_native_splash:create

    - name: APK Derle (Release Surumu)
      run: flutter build apk --release

    - name: Hem APK Hem Tum Kaynak Kodlari Tek Bir ZIP Paketi Yap
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ' | tr -d '\r')
        SUPER_ZIP_NAME="seray_saglik_HEPS_ICINDE_v${VERSION}.zip"
        cp build/app/outputs/flutter-apk/app-release.apk "./seray_saglik_asistanim_v${VERSION}.apk"
        zip -r "${SUPER_ZIP_NAME}" "./seray_saglik_asistanim_v${VERSION}.apk" lib assets pubspec.yaml .github android
        echo "SUPER_ZIP=${SUPER_ZIP_NAME}" >> $GITHUB_ENV

    - name: 🎁 TEK PAKETTE (APK + KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SUPER_ZIP }}
        path: ${{ env.SUPER_ZIP }}
