name: Flutter Build APK from ZIP (Safe Scratch Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Proje ZIP Dosyasını Klasöre Çıkar (Unzip)
      run: |
        if [ -f "seray_saglikv1.46.zip" ]; then
          mkdir -p ham_ayiklama
          unzip -q seray_saglikv1.46.zip -d ham_ayiklama
          
          if [ -f "ham_ayiklama/pubspec.yaml" ]; then
            mv ham_ayiklama eski_proje
          else
            mkdir -p eski_proje
            mv ham_ayiklama/* eski_proje/ 2>/dev/null || mv ham_ayiklama eski_proje
          fi
          echo "Eski kaynak dosyalar 'eski_proje' klasörüne alındı."
        else
          echo "HATA: seray_saglikv1.46.zip dosyası bulunamadı!"
          exit 1
        fi

    - name: Sıfırdan Modern v2 Uyumlu Proje Oluştur
      run: |
        # Hata üreten tüm eski Android klasörünü baypas etmek için yepyeni bir proje oluşturuyoruz
        flutter create --platforms=android yeni_temiz_proje
        echo "Sıfır km modern Android projesi başarıyla üretildi."

    - name: Kaynak Kodları Yeni Projeye Enjekte Et
      run: |
        # Sizin yazdığınız uygulama kodlarını sıfır projenin üzerine yazıyoruz
        rm -rf yeni_temiz_proje/lib yeni_temiz_proje/pubspec.yaml
        cp -r eski_proje/lib yeni_temiz_proje/
        cp eski_proje/pubspec.yaml yeni_temiz_proje/
        
        # Eğer projenizde assets (resimler vb.) klasörü varsa onu da taşıyoruz
        if [ -d "eski_proje/assets" ]; then
          cp -r eski_proje/assets yeni_temiz_proje/
        fi
        echo "Uygulama kaynak kodları modern yapıya taşındı."

    - name: Android build.gradle Güncelle
      run: |
        # Sizin en başta istediğiniz güncel Gradle ayarlarını yeni temiz projeye uyguluyoruz
        echo "" | base64 -d > yeni_temiz_proje/android/app/build.gradle
        echo "Yeni build.gradle sorunsuz şekilde oluşturuldu."

    - name: Bagimliliklari Yukle
      working-directory: yeni_temiz_proje
      run: flutter pub get

    - name: Uygulama Ikonlarini Olustur
      working-directory: yeni_temiz_proje
      run: |
        flutter pub run flutter_launcher_icons || echo "Ikon paketi bulunamadı, bu adım atlanıyor."

    - name: Acilis Ekranini (Splash) Olustur
      working-directory: yeni_temiz_proje
      run: |
        flutter pub run flutter_native_splash:create || echo "Splash paketi bulunamadı, bu adım atlanıyor."

    - name: APK Derle (Release Surumu)
      working-directory: yeni_temiz_proje
      run: flutter build apk --release

    - name: Hem APK Hem Tum Kaynak Kodlari Tek Bir ZIP Paketi Yap
      working-directory: yeni_temiz_proje
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ' | tr -d '\r')
        SUPER_ZIP_NAME="seray_saglik_HEPS_ICINDE_v${VERSION}.zip"
        cp build/app/outputs/flutter-apk/app-release.apk "../${SUPER_ZIP_NAME%.zip}.apk"
        cd ..
        zip -r "${SUPER_ZIP_NAME}" "./${SUPER_ZIP_NAME%.zip}.apk" yeni_temiz_proje/lib yeni_temiz_proje/pubspec.yaml .github
        echo "SUPER_ZIP=${SUPER_ZIP_NAME}" >> $GITHUB_ENV

    - name: 🎁 TEK PAKETTE (APK + KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_derleme_sonucu
        path: ${{ env.SUPER_ZIP }}
        
