name: Flutter Build APK from Any ZIP (Seray Saglik Final Crash Fix)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Proje ZIP Dosyasını Otomatik Tespit Et ve Çıkar
      run: |
        ZIP_DOSYASI=$(ls *.zip | head -n 1)
        if [ -n "$ZIP_DOSYASI" ]; then
          echo "Bulunan Proje Paketi: $ZIP_DOSYASI"
          mkdir -p ham_ayiklama
          unzip -q "$ZIP_DOSYASI" -d ham_ayiklama
          
          if [ -f "ham_ayiklama/pubspec.yaml" ]; then
            mv ham_ayiklama projem
          else
            mkdir -p projem
            mv ham_ayiklama/* projem/ 2>/dev/null || mv ham_ayiklama projem
          fi
          echo "Kaynak dosyalar başarıyla ayıklandı."
        else
          echo "HATA: Ana dizinde hiçbir .zip dosyası bulunamadı!"
          exit 1
        fi

    - name: Otomatik Sürüm (Version) Artırıcı Yapılandırılıyor
      run: |
        cd projem
        OLD_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
        BASE_VER=$(echo $OLD_VERSION | cut -d'+' -f1)
        BUILD_NUM=$(echo $OLD_VERSION | cut -d'+' -f2)
        NEW_PATCH=$(echo $BASE_VER | cut -d'.' -f3)
        NEW_PATCH=$((NEW_PATCH + 1))
        NEW_VERSION="$(echo $BASE_VER | cut -d'.' -f1).$(echo $BASE_VER | cut -d'.' -f2).${NEW_PATCH}+$((BUILD_NUM + 1))"
        sed -i "s/version: .*/version: ${NEW_VERSION}/g" pubspec.yaml
        echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
        echo "SUPER_VERSION=${NEW_VERSION%+*}" >> $GITHUB_ENV
        echo "Eski Versiyon: $OLD_VERSION -> Yeni Versiyon: $NEW_VERSION"

    - name: Uygulama İsmi, Paket Adı ve MainActivity Düzeltiliyor
      run: |
        sed -i 's/android:label=".*/android:label="Seray Sağlık Asistanım"/g' projem/android/app/src/main/AndroidManifest.xml
        
        # MainActivity.kt dosyasını tek satırlık komutlarla sıfırdan ve güvenle oluşturuyoruz
        MAIN_DIR="projem/android/app/src/main/kotlin/com/serayteknoloji/saglik_asistanim"
        mkdir -p "$MAIN_DIR"
        echo "package com.serayteknoloji.saglik_asistanim" > "$MAIN_DIR/MainActivity.kt"
        echo "" >> "$MAIN_DIR/MainActivity.kt"
        echo "import io.flutter.embedding.android.FlutterActivity" >> "$MAIN_DIR/MainActivity.kt"
        echo "" >> "$MAIN_DIR/MainActivity.kt"
        echo "class MainActivity: FlutterActivity() {" >> "$MAIN_DIR/MainActivity.kt"
        echo "}" >> "$MAIN_DIR/MainActivity.kt"

        # build.gradle Dosyasını Güncelle
        cat << 'EOF' > projem/android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace "com.serayteknoloji.saglik_asistanim"
    compileSdk 36
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.serayteknoloji.saglik_asistanim"
        minSdkVersion 23
        targetSdkVersion 36
        multiDexEnabled true
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}
dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
EOF
        echo "MainActivity ve build.gradle başarıyla güncellendi."

    - name: Crash Çökme Engelleyici Servisleri Manifest'e Enjekte Et
      run: |
        MANIFEST_YOL="projem/android/app/src/main/AndroidManifest.xml"
        
        sed -i 's/@mipmap\/launcher_icon/@mipmap\/ic_launcher/g' $MANIFEST_YOL
        
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST_YOL
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST_YOL
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST_YOL
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST_YOL
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST_YOL
        
        SERVIS_KODU='<receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" /><receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>'
        sed -i "s|<activity|$SERVIS_KODU\n        <activity|g" $MANIFEST_YOL
        echo "Servis kayıtları kusursuz şekilde düzeltildi."

    - name: Özel PNG Resimlerini İkon ve Splash Ekranına Dönüştür
      run: |
        cd projem
        sed -i 's/ios: true/ios: false/g' pubspec.yaml
        flutter pub get
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create

    - name: Bağımlılıklar Yükleniyor ve APK Derleniyor
      run: |
        cd projem
        flutter clean
        flutter build apk --release

    - name: Sadece Gerekli Klasörleri ve APK'yı Hafif ZIP Paketi Yap
      run: |
        cp projem/build/app/outputs/flutter-apk/app-release.apk "./Seray_Saglik_Asistanim_v${{ env.SUPER_VERSION }}.apk"
        mkdir -p teslimat_paketi
        cp "./Seray_Saglik_Asistanim_v${{ env.SUPER_VERSION }}.apk" ./teslimat_paketi/
        cp -r projem/lib ./teslimat_paketi/
        cp -r projem/assets ./teslimat_paketi/
        cp projem/pubspec.yaml ./teslimat_paketi/
        cp -r .github ./teslimat_paketi/
        
        cd teslimat_paketi
        zip -r "../seray_saglik_asistanim_v${{ env.SUPER_VERSION }}.zip" .
        cd ..

    - name: 🎁 TEK PAKETTE (APK + TÜM KAYNAK KODLAR) TESLIM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_asistanim_yeni_paket
        path: "seray_saglik_asistanim_v*.zip"
        
