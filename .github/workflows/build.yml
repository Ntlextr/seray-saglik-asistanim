jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac ve yapiyi duzelt
        run: |
          mkdir -p gecici_klasor
          unzip -o Seray_Teknoloji.zip -d gecici_klasor
          if [ -f gecici_klasor/pubspec.yaml ]; then
            KAYNAK="gecici_klasor"
          else
            KAYNAK=$(dirname "$(find gecici_klasor -maxdepth 3 -name pubspec.yaml | head -n 1)")
          fi
          echo "Bulunan proje klasoru: $KAYNAK"
          cp -r "$KAYNAK"/. .
      - name: Kontrol
        run: |
          echo "pubspec.yaml var mi:"
          ls pubspec.yaml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
      - name: Temizle ve Hazirla
        run: |
          flutter clean
          flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: APK'yi numarala
        run: cp build/app/outputs/flutter-apk/app-release.apk seray-tekno-v${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seray-tekno-v${{ github.run_number }}
          path: seray-tekno-v${{ github.run
