name: Flutter Build APK from Any ZIP (Seray Saglik Final Fix)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla (Checkout)
      uses: actions/checkout@v4

    - name: Java JDK Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Flutter Kurulumu
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Proje ZIP Dosyasını Otomatik Tespit Et ve Çıkar
      run: |
        ZIP_DOSYASI=$(ls *.zip 2>/dev/null | head -n 1)
        if [ -n "$ZIP_DOSYASI" ]; then
          echo "Bulunan Proje Paketi: $ZIP_DOSYASI"
          mkdir -p ham_ayiklama
          unzip -q "$ZIP_DOSYASI" -d ham_ayiklama

          # pubspec.yaml'ı klasör yapısı ne olursa olsun (kat kat iç içe de olsa) otomatik bul
          PUBSPEC_YOLU=$(find ham_ayiklama -maxdepth 4 -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC_YOLU" ]; then
            echo "HATA: ZIP içinde hiçbir yerde pubspec.yaml bulunamadı!"
            find ham_ayiklama -maxdepth 3
            exit 1
          fi
          KAYNAK_KLASOR=$(dirname "$PUBSPEC_YOLU")
          mv "$KAYNAK_KLASOR" projem
          echo "Kaynak dosyalar başarıyla ayıklandı. (Bulunduğu yol: $PUBSPEC_YOLU)"
        elif [ -f "pubspec.yaml" ]; then
          mkdir -p projem
          shopt -s dotglob
          for item in *; do
            [ "$item" = "projem" ] && continue
            mv "$item" projem/ 2>/dev/null || true
          done
          echo "Kaynak dosyalar doğrudan repodan kullanıldı (zip yok)."
        else
          echo "HATA: Ne bir .zip dosyası ne de pubspec.yaml bulundu!"
          exit 1
        fi

    - name: Otomatik Sürüm (Version) Artırıcı Yapılandırılıyor
      run: |
        cd projem
        OLD_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //')
        BASE_VER=$(echo $OLD_VERSION | cut -d'+' -f1)
        BUILD_NUM=$(echo $OLD_VERSION | cut -d'+' -f2)
        NEW_PATCH=$(echo $BASE_VER | cut -d'.' -f3)
        NEW_PATCH=$((NEW_PATCH + 1))
        NEW_VERSION="$(echo $BASE_VER | cut -d'.' -f1).$(echo $BASE_VER | cut -d'.' -f2).${NEW_PATCH}+$((BUILD_NUM + 1))"
        sed -i "s/version: .*/version: ${NEW_VERSION}/g" pubspec.yaml
        echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
        echo "SUPER_VERSION=${NEW_VERSION%+*}" >> $GITHUB_ENV
        echo "Eski Versiyon: $OLD_VERSION -> Yeni Versiyon: $NEW_VERSION"

    - name: Uygulama İsmi ve MainActivity Düzeltiliyor
      run: |
        sed -i 's/android:label=".*/android:label="Seray Sağlık Asistanım"/g' projem/android/app/src/main/AndroidManifest.xml

        MAIN_DIR="projem/android/app/src/main/kotlin/com/serayteknoloji/saglik_asistanim"
        mkdir -p "$MAIN_DIR"
        printf 'package com.serayteknoloji.saglik_asistanim\n\nimport io.flutter.embedding.android.FlutterActivity\n\nclass MainActivity: FlutterActivity() {\n}\n' > "$MAIN_DIR/MainActivity.kt"
        echo "MainActivity güncellendi. build.gradle repodaki haliyle bırakıldı (artık ezilmiyor)."

    - name: Release Keystore ve key.properties Olusturuluyor
      run: |
        mkdir -p projem/android/app
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > projem/android/app/seray-release-key.jks
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > projem/android/key.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> projem/android/key.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> projem/android/key.properties
        echo "storeFile=seray-release-key.jks" >> projem/android/key.properties
        echo "key.properties basariyla olusturuldu."
          

    - name: Crash Çökme Engelleyici Servisleri Manifest'e Enjekte Et (idempotent)
      run: |
        MANIFEST_YOL="projem/android/app/src/main/AndroidManifest.xml"

        sed -i 's/@mipmap\/launcher_icon/@mipmap\/ic_launcher/g' $MANIFEST_YOL

        # Her izni/receiver'ı eklemeden önce zaten var mı diye kontrol ediyoruz - tekrar tekrar eklenmesini (duplicate) önler
        grep -q 'SCHEDULE_EXACT_ALARM' $MANIFEST_YOL || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST_YOL
        grep -q 'USE_EXACT_ALARM' $MANIFEST_YOL || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST_YOL
        grep -q 'RECEIVE_BOOT_COMPLETED' $MANIFEST_YOL || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />' $MANIFEST_YOL
        grep -q 'android.permission.VIBRATE' $MANIFEST_YOL || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.VIBRATE" />' $MANIFEST_YOL
        grep -q 'android.permission.WAKE_LOCK' $MANIFEST_YOL || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST_YOL

        if ! grep -q 'ScheduledNotificationReceiver' $MANIFEST_YOL; then
          SERVIS_KODU='<receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" android:exported="false" /><receiver android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver>'
          sed -i "s|<activity|$SERVIS_KODU\n        <activity|g" $MANIFEST_YOL
        fi
        echo "Servis kayıtları kontrol edildi (mükerrer eklenmedi)."

    - name: Özel PNG Resimlerini İkon ve Splash Ekranına Dönüştür
      run: |
        cd projem
        sed -i 's/ios: true/ios: false/g' pubspec.yaml
        flutter pub get
        flutter pub run flutter_launcher_icons
        flutter pub run flutter_native_splash:create

    - name: Bağımlılıklar Yükleniyor ve APK Derleniyor
      run: |
        cd projem
        flutter clean
        flutter build apk --release

    - name: Tüm Kodları ve Klasörleri ZIP Paketi Yap
      run: |
        cp projem/build/app/outputs/flutter-apk/app-release.apk "./Seray_Saglik_Asistanim_v${{ env.SUPER_VERSION }}.apk"
        mkdir -p teslimat_paketi

        cp "./Seray_Saglik_Asistanim_v${{ env.SUPER_VERSION }}.apk" ./teslimat_paketi/
        cp -r projem/lib ./teslimat_paketi/ 2>/dev/null || true
        cp -r projem/assets ./teslimat_paketi/ 2>/dev/null || true
        cp -r projem/android ./teslimat_paketi/ 2>/dev/null || true
        cp projem/pubspec.yaml ./teslimat_paketi/ 2>/dev/null || true
        cp -r .github ./teslimat_paketi/ 2>/dev/null || true

        # Gizli anahtar dosyalarını teslim paketine ASLA dahil etme
        rm -f ./teslimat_paketi/android/key.properties
        rm -f ./teslimat_paketi/android/app/seray-release-key.jks

        cd teslimat_paketi
        zip -r "../seray_saglik_asistanim_v${{ env.SUPER_VERSION }}.zip" .
        cd ..

    - name: Tarih ve Saat Damgası Oluşturuluyor
      run: echo "TARIH_SAAT=$(TZ='Europe/Istanbul' date +'%d_%m_%Y_%H%M')" >> $GITHUB_ENV

    - name: TEK PAKETTE TESLİM ET
      uses: actions/upload-artifact@v4
      with:
        name: seray_saglik_asistanim_${{ env.TARIH_SAAT }}
        path: "seray_saglik_asistanim_v*.zip"
        retention-days: 3

